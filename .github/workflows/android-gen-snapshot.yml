name: android-gen-snapshot

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: install deps
        run: |
          sudo apt update
          sudo apt install -y \
            libfreetype-dev \
            libfontconfig1-dev \
            ninja-build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: install python requirements
        run: python -m pip install -r requirements.txt

      - name: Ensure depot_tools is available
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v gclient >/dev/null 2>&1; then
            DEPOT_DIR="$RUNNER_TEMP/depot_tools"
            if [ ! -d "$DEPOT_DIR" ]; then
              git clone --depth=1 https://chromium.googlesource.com/chromium/tools/depot_tools.git "$DEPOT_DIR"
            fi
            echo "$DEPOT_DIR" >> "$GITHUB_PATH"
          fi

      - name: detect Android NDK
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${ANDROID_NDK:-}" ]; then
            NDK_DIR="$ANDROID_NDK"
          elif [ -n "${ANDROID_NDK_LATEST_HOME:-}" ]; then
            NDK_DIR="$ANDROID_NDK_LATEST_HOME"
          elif [ -n "${ANDROID_NDK_HOME:-}" ]; then
            NDK_DIR="$ANDROID_NDK_HOME"
          else
            echo "Android NDK not found on runner" >&2
            exit 1
          fi
          if [ ! -f "$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" ]; then
            echo "Error: NDK at '$NDK_DIR' missing expected toolchain: clang" >&2
            exit 1
          fi
          echo "ANDROID_NDK=$NDK_DIR" >> "$GITHUB_ENV"

      - name: free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache

      - name: fetch flutter sources
        run: |
          echo "PATH=$PATH"
          which -a python python3 || true
          python -V
          python -c "import sys; print(sys.executable); print(sys.path)"
          pip list 2>/dev/null | grep -iE "git|yaml|fire|loguru" || true
          python build.py clone
          python build.py sync

      - name: build termux sysroot
        run: python build.py sysroot --arch=arm64

      - name: configure android (termux host tools)
        run: python build.py configure_android --arch=arm64 --mode=release

      - name: build gen_snapshot
        run: python build.py build_android_gen_snapshot

      - name: verify binary
        run: |
          BIN=flutter/engine/src/out/android_release_arm64/host/gen_snapshot
          ls -lh "$BIN"
          file "$BIN"
          "$BIN" --version || true
          readelf -h "$BIN" | grep -E 'Machine|Type'

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gen_snapshot-android-arm64-native
          path: flutter/engine/src/out/android_release_arm64/host/gen_snapshot
          if-no-files-found: error
